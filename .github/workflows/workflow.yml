name: Daily Docker Task

on:
  schedule:
    - cron: "0 2 * * *"  # runs daily at 02:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PNPM_VERSION: ${{ vars.PNPM_VERSION  }}

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      release_found: ${{ steps.get_release.outputs.release_found }}
      RELEASE: ${{ steps.get_release.outputs.RELEASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and List Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: "n8n-enterprise"
        run: |
          VERSIONS_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /user/packages/container/$PACKAGE_NAME/versions)
          
          TAGS=$(echo "$VERSIONS_JSON" | jq -r '.[].metadata.container.tags[] | select(. != null)')
          
          echo "$TAGS" > tags.txt

      - name: Get value from API
        id: get_release
        run: |
          set -e
          RELEASE=$(python check_new_release.py)
          if [ -z "$RELEASE" ]; then
            echo "No new release found, stopping workflow."
            echo "release_found=false" >> $GITHUB_OUTPUT
          else
            echo "RELEASE=$RELEASE" >> $GITHUB_OUTPUT
            echo "Found release: $RELEASE"
            echo "release_found=true" >> $GITHUB_OUTPUT
          fi


  build-and-push:
    needs: check-release
    if: needs.check-release.outputs.release_found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ needs.check-release.outputs.RELEASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PNPM_VERSION
        id: extract_pnpm
        run: |
          set -e
          DOCKERFILE_URL="https://raw.githubusercontent.com/n8n-io/n8n/refs/heads/master/packages/%40n8n/benchmark/Dockerfile"
          PNPM_VER=$(curl -sSfL "$DOCKERFILE_URL" 2>/dev/null | sed -n -E 's/^ARG[[:space:]]+PNPM_VERSION=([^[:space:]]+).*/\1/p' | head -n 1 | tr -d '[:space:]"' || true)
          if [ -n "$PNPM_VER" ]; then
            echo "Extracted PNPM_VERSION from upstream: $PNPM_VER"
            echo "PNPM_VERSION=$PNPM_VER" >> "$GITHUB_ENV"
            echo "pnpm_version=$PNPM_VER" >> "$GITHUB_OUTPUT"
          else
            echo "Notice: Could not extract PNPM_VERSION from $DOCKERFILE_URL. Falling back to GitHub env."
            if [ -z "$PNPM_VERSION" ]; then
              echo "Error: PNPM_VERSION is not set in GitHub env (vars.PNPM_VERSION is empty)." >&2
              exit 1
            fi
            echo "Using PNPM_VERSION from GitHub env: $PNPM_VERSION"
            echo "pnpm_version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build patcher image
        run: |
          set -e
          docker build --build-arg PNPM_VERSION=$PNPM_VERSION -t n8n_patcher .

      - name: Build Docker image
        run: |
          set -e
          RELEASE=$RELEASE IMAGE_TAG=$RELEASE docker compose -f docker-compose_build.yml up --abort-on-container-exit --exit-code-from n8n-enterprise-patcher
          docker compose -f docker-compose_build.yml down -v
        env:
          # --- ADDED: Pass Node memory limits to the build process ---
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Push Docker image(s) to GHCR
        run: |
          set -e
          docker push "ghcr.io/m-ahadi/n8n-enterprise:$RELEASE"
          docker push "ghcr.io/m-ahadi/runners:$RELEASE"
          
          docker tag "ghcr.io/m-ahadi/n8n-enterprise:$RELEASE" "ghcr.io/m-ahadi/n8n-enterprise:latest"
          docker tag "ghcr.io/m-ahadi/runners:$RELEASE" "ghcr.io/m-ahadi/runners:latest"
          
          docker push "ghcr.io/m-ahadi/n8n-enterprise:latest"
          docker push "ghcr.io/m-ahadi/runners:latest"

  notify:
    needs: [check-release, build-and-push]
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
      RELEASE: ${{ needs.check-release.outputs.RELEASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Telegram notification
        run: |
          set -e
          python send_message.py
